<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo Cilindro e Cone</title>
</head>
<body>
    <nav>
        <img src="img/sharingan.png">
        <h1>Calculador Cone e Cilindro</h1>
    </nav>
<div class="container">
    <div class="cilindro">
        <h1>Cilindro</h1>
        <label for="raio_cilindro"></label><br>
        <input type="number" id="raio_cilindro"><br>
        <br>

        <label for="altura_cilindro"></label><br>
        <input type="number" id="altura_cilindro"><br>
        <br>

        <button id="calcularClindro">Calcular</button>
        <div id="resCilindro"></div>
        <br><br><br>
        <img src="img/download1.png" alt="Cilindro">
    </div>
    <hr>
    <div class="cone">
        <h1>Cone</h1>
        <label for="raio_cone"></label><br>
        <input type="number" id="raio_cone"><br>
        <br>
    
        <label for="altura_cone"></label><br>
        <input type="number" id="altura_cone"><br>
        <br>

        <button id="calcularCone">Calcular</button>
        <div id="resCone"></div>
        <br><br><br>
        <img src="img/download.jfif" alt="Cone">
    </div>
</div>
</body>
</html>
